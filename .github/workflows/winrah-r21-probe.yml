name: WinRah SQL proxy read-only probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sqlproxy-readonly-probe:
    runs-on: ubuntu-latest
    env:
      SQLPROXY_URL: https://wncxfbtjsmrvadgnmots.supabase.co/functions/v1/sql-proxy
      SQLPROXY_KEY: ${{ secrets.SQLPROXY_KEY }}
      PROXY_SECRET: ${{ secrets.PROXY_SECRET }}

    steps:
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SQLPROXY_KEY" ]] || { echo "::error::secret SQLPROXY_KEY missing"; exit 1; }
          [[ -n "$PROXY_SECRET" ]] || { echo "::error::secret PROXY_SECRET missing"; exit 1; }

      - name: Sanitized credential shape check
        shell: bash
        run: |
          set -euo pipefail
          echo "sqlproxy_key_length=${#SQLPROXY_KEY}"
          if [[ "$SQLPROXY_KEY" == eyJ* ]]; then echo "sqlproxy_key_shape=jwt_like"; else echo "sqlproxy_key_shape=not_jwt_like"; fi
          echo "proxy_secret_length=${#PROXY_SECRET}"
          [[ ${#PROXY_SECRET} -ge 32 ]] || { echo "::error::PROXY_SECRET shorter than 32 characters"; exit 1; }

      - name: Probe SELECT count
        shell: bash
        run: |
          set -euo pipefail
          set +x
          auth_args=()
          if [[ "$SQLPROXY_KEY" == eyJ* ]]; then auth_args=(-H "Authorization: Bearer $SQLPROXY_KEY"); fi
          status=$(curl --silent --show-error --max-time 20 --output /tmp/probe-count.json --write-out '%{http_code}' \
            "$SQLPROXY_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $SQLPROXY_KEY" \
            -H "X-Proxy-Secret: $PROXY_SECRET" \
            "${auth_args[@]}" \
            --data '{"query":"SELECT count(*)::int AS stations FROM public.stations"}')
          [[ "$status" == "200" ]] || { echo "::error::SELECT probe HTTP status $status"; exit 1; }
          grep -Eq '"stations"[[:space:]]*:[[:space:]]*28' /tmp/probe-count.json \
            || { echo "::error::SELECT probe did not return stations=28"; exit 1; }
          echo "select_probe=success stations=28"

      - name: Probe CTE support
        shell: bash
        run: |
          set -euo pipefail
          set +x
          auth_args=()
          if [[ "$SQLPROXY_KEY" == eyJ* ]]; then auth_args=(-H "Authorization: Bearer $SQLPROXY_KEY"); fi
          status=$(curl --silent --show-error --max-time 20 --output /tmp/probe-cte.json --write-out '%{http_code}' \
            "$SQLPROXY_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $SQLPROXY_KEY" \
            -H "X-Proxy-Secret: $PROXY_SECRET" \
            "${auth_args[@]}" \
            --data '{"query":"WITH x AS (SELECT 42 AS v) SELECT v FROM x"}')
          [[ "$status" == "200" ]] || { echo "::error::CTE probe HTTP status $status"; exit 1; }
          grep -Eq '"v"[[:space:]]*:[[:space:]]*42' /tmp/probe-cte.json \
            || { echo "::error::CTE probe did not return v=42"; exit 1; }
          echo "cte_probe=success v=42"

      - name: Sanitized summary
        if: always()
        shell: bash
        run: |
          {
            echo "### SQL proxy read-only probe (sanitized)"
            echo '```'
            if [[ -f /tmp/probe-count.json ]] && grep -Eq '"stations"[[:space:]]*:[[:space:]]*28' /tmp/probe-count.json; then echo "select_probe=success stations=28"; else echo "select_probe=not_verified"; fi
            if [[ -f /tmp/probe-cte.json ]] && grep -Eq '"v"[[:space:]]*:[[:space:]]*42' /tmp/probe-cte.json; then echo "cte_probe=success v=42"; else echo "cte_probe=not_verified"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
