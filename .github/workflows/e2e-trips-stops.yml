name: Backend trips and stops E2E

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/e2e-trips-stops.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/e2e-trips-stops.yml"

permissions:
  contents: read

jobs:
  trips-stops-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: winrah_e2e
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d winrah_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest

      - name: Prepare local E2E database
        env:
          WINRAH_E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/winrah_e2e
        run: python backend/tests/prepare_e2e_database.py

      - name: Run trips and stops E2E tests
        env:
          WINRAH_E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/winrah_e2e
        run: pytest -q backend/tests/test_trips_stops_e2e.py
